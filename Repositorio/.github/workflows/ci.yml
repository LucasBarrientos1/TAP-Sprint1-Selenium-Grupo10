name: CI Sprint 3 - Grupo 10

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar pruebas automatizadas con Pytest y generar reporte HTML
      run: |
        python -m pytest --html=report.html --self-contained-html -v

    - name: Subir artefactos (Reporte HTML y Evidencias)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reporte-test-sprint3
        path: report.html